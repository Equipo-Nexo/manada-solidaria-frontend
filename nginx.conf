server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El shell y los archivos que controlan la PWA siempre deben revalidarse.
    # En especial, sw.js no debe quedar atrapado en una cache immutable.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /sw.js {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /registerSW.js {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite genera nombres con hash dentro de /assets, por lo que estos
    # recursos (incluidos iconos importados) pueden cachearse por un año.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Los recursos estáticos sin hash deben revalidarse en cada navegación.
    location ~* \.(?:mjs|css|js|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot)$ {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    gzip_vary on;
}
